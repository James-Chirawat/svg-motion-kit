<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" width="360" height="264" class="smk-offline-vitetailwi" role="img" aria-labelledby="smk-title-vitetailwi">
  <title id="smk-title-vitetailwi">You're offline</title>
  <style>
    .smk-offline-vitetailwi {
      --c-bg: #ffffff; --c-fg: #020817; --c-muted: #64748b;
      --c-line: #e2e8f0; --c-primary: #2563eb;
      --c-soft: color-mix(in srgb, var(--c-primary) 14%, var(--c-bg));
    }
    @media (prefers-color-scheme: dark) { .smk-offline-vitetailwi { --c-bg: #020817; --c-fg: #f8fafc; --c-muted: #94a3b8; --c-line: #1e293b; --c-primary: #3b82f6; } }
    .smk-offline-vitetailwi text { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .smk-offline-vitetailwi .card   { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .smk-offline-vitetailwi .cable  { fill: none; stroke: var(--c-fg); stroke-width: 6; stroke-linecap: round; }
    .smk-offline-vitetailwi .plug   { fill: var(--c-primary); }
    .smk-offline-vitetailwi .prong  { fill: var(--c-fg); }
    .smk-offline-vitetailwi .socket { fill: var(--c-soft); stroke: var(--c-primary); stroke-width: 2.5; }
    .smk-offline-vitetailwi .hole   { fill: var(--c-fg); }
    .smk-offline-vitetailwi .spark  { fill: none; stroke: var(--c-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; animation: smk-offline-spark 2.8s linear infinite; }
    .smk-offline-vitetailwi .dot    { fill: var(--c-primary); transform-box: fill-box; transform-origin: center; animation: smk-offline-bob 1.2s ease-in-out infinite; }
    .smk-offline-vitetailwi .title  { fill: var(--c-fg); font-size: 16px; font-weight: 650; }
    .smk-offline-vitetailwi .sub    { fill: var(--c-muted); font-size: 13px; }
    .smk-offline-vitetailwi .reach-l { animation: smk-offline-reach-l 2.8s cubic-bezier(.45, 0, .55, 1) infinite; }
    .smk-offline-vitetailwi .reach-r { animation: smk-offline-reach-r 2.8s cubic-bezier(.45, 0, .55, 1) infinite; }
    @keyframes smk-offline-reach-l { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
    @keyframes smk-offline-reach-r { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-10px); } }
    @keyframes smk-offline-spark   { 0%, 42%, 60%, 100% { opacity: 0; } 47%, 53% { opacity: 1; } }
    @keyframes smk-offline-bob     { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .smk-offline-vitetailwi * { animation: none !important; } .smk-offline-vitetailwi .dot { opacity: .6; } }
  </style>
  <rect class="card" x="1" y="1" width="358" height="262" rx="12"/>
  <g class="reach-l">
    <path class="cable" d="M-10 150 C60 150 72 112 122 112"/>
    <rect class="plug" x="118" y="94" width="42" height="36" rx="9"/>
    <rect class="prong" x="158" y="102" width="18" height="6" rx="3"/>
    <rect class="prong" x="158" y="116" width="18" height="6" rx="3"/>
  </g>
  <g class="reach-r">
    <path class="cable" d="M370 150 C300 150 288 112 238 112"/>
    <rect class="socket" x="200" y="94" width="42" height="36" rx="9"/>
    <rect class="hole" x="206" y="102" width="10" height="6" rx="3"/>
    <rect class="hole" x="206" y="116" width="10" height="6" rx="3"/>
  </g>
  <path class="spark" d="M183 98 L189 108 L184 110 L191 122"/>
  <text class="title" x="180" y="200" text-anchor="middle">You're offline</text>
  <text class="sub" x="180" y="222" text-anchor="middle">We'll reconnect automatically</text>
  <circle class="dot" cx="168" cy="242" r="3.5"/>
  <circle class="dot" cx="180" cy="242" r="3.5" style="animation-delay:.15s"/>
  <circle class="dot" cx="192" cy="242" r="3.5" style="animation-delay:.3s"/>
</svg>
