<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" width="360" height="264" class="smk-error-defaulterr" role="img" aria-labelledby="smk-title-defaulterr">
  <title id="smk-title-defaulterr">Something went wrong</title>
  <style>
    .smk-error-defaulterr {
      --c-bg: #FAF7F2; --c-fg: #2A211B; --c-muted: #7D7268;
      --c-line: #E8DFD4; --c-danger: #C2412D; --c-primary: #2A211B;
      --c-soft: color-mix(in srgb, var(--c-danger) 12%, var(--c-bg));
    }
    @media (prefers-color-scheme: dark) { .smk-error-defaulterr { --c-bg: #16120F; --c-fg: #F2EAE2; --c-muted: #A39A90; --c-line: #2E2620; --c-danger: #F07A63; --c-primary: #F2EAE2; } }
    .smk-error-defaulterr text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .smk-error-defaulterr .card   { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .smk-error-defaulterr .node   { fill: var(--c-bg); stroke: var(--c-fg); stroke-width: 2.5; }
    .smk-error-defaulterr .wire   { fill: none; stroke: var(--c-muted); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 5 6; }
    .smk-error-defaulterr .disc   { fill: var(--c-soft); }
    .smk-error-defaulterr .mark   { fill: none; stroke: var(--c-danger); stroke-width: 6; stroke-linecap: round; }
    .smk-error-defaulterr .dot    { fill: var(--c-danger); }
    .smk-error-defaulterr .title  { fill: var(--c-fg); font-size: 16px; font-weight: 650; }
    .smk-error-defaulterr .sub    { fill: var(--c-muted); font-size: 13px; }
    .smk-error-defaulterr .btn    { fill: none; stroke: var(--c-primary); stroke-width: 1.5; }
    .smk-error-defaulterr .btn-t  { fill: var(--c-primary); font-size: 12px; font-weight: 600; }
    .smk-error-defaulterr .snap-l { animation: smk-error-snap-l .5s .4s cubic-bezier(.3, 1.6, .5, 1) both; }
    .smk-error-defaulterr .snap-r { animation: smk-error-snap-r .5s .4s cubic-bezier(.3, 1.6, .5, 1) both; }
    .smk-error-defaulterr .draw   { stroke-dasharray: 1; stroke-dashoffset: 0; animation: smk-error-draw .5s cubic-bezier(.65, 0, .35, 1) both; }
    .smk-error-defaulterr .shake  { transform-origin: 180px 100px; animation: smk-error-shake .5s 1.3s ease-in-out both; }
    .smk-error-defaulterr .rise   { animation: smk-error-rise .6s ease-out both; }
    @keyframes smk-error-snap-l { from { transform: translateX(10px); } to { transform: translateX(0); } }
    @keyframes smk-error-snap-r { from { transform: translateX(-10px); } to { transform: translateX(0); } }
    @keyframes smk-error-draw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes smk-error-shake  { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(-3deg); } }
    @keyframes smk-error-rise   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .smk-error-defaulterr * { animation: none !important; } }
  </style>
  <rect class="card" x="1" y="1" width="358" height="262" rx="20"/>
  <g class="snap-l"><path class="wire" d="M66 100 H128"/><circle class="node" cx="58" cy="100" r="9"/></g>
  <g class="snap-r"><path class="wire" d="M232 100 H294"/><circle class="node" cx="302" cy="100" r="9"/></g>
  <g class="shake">
    <circle class="disc" cx="180" cy="100" r="42"/>
    <path class="mark draw" pathLength="1" d="M180 78 V106" style="animation-delay:.8s"/>
    <circle class="dot rise" cx="180" cy="121" r="4.5" style="animation-delay:1.1s"/>
  </g>
  <text class="title rise" x="180" y="176" text-anchor="middle" style="animation-delay:.9s">Something went wrong</text>
  <text class="sub rise" x="180" y="198" text-anchor="middle" style="animation-delay:1s">We couldn't load this. Check your connection.</text>
  <g class="rise" style="animation-delay:1.2s">
    <rect class="btn" x="138" y="212" width="84" height="30" rx="15"/>
    <text class="btn-t" x="180" y="231" text-anchor="middle">Try again</text>
  </g>
</svg>
