<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" width="360" height="264" class="smk-success-plainhtmls" role="img" aria-labelledby="smk-title-plainhtmls">
  <title id="smk-title-plainhtmls">Changes saved</title>
  <style>
    .smk-success-plainhtmls {
      --c-bg: #ffffff; --c-fg: #0f172a; --c-muted: #64748b;
      --c-line: #e2e8f0; --c-primary: #0ea5e9; --c-accent: #f97316;
      --c-soft: color-mix(in srgb, var(--c-primary) 16%, var(--c-bg));
    }
    @media (prefers-color-scheme: dark) { .smk-success-plainhtmls { --c-bg: #0b1120; --c-fg: #f1f5f9; --c-muted: #94a3b8; --c-line: #1e293b; --c-primary: #38bdf8; --c-accent: #fb923c; } }
    .smk-success-plainhtmls text { font-family: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .smk-success-plainhtmls .card  { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .smk-success-plainhtmls .disc  { fill: var(--c-soft); }
    .smk-success-plainhtmls .ring  { fill: none; stroke: var(--c-primary); stroke-width: 6; stroke-linecap: round; }
    .smk-success-plainhtmls .tick  { fill: none; stroke: var(--c-primary); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .smk-success-plainhtmls .pulse { fill: none; stroke: var(--c-primary); stroke-width: 2; opacity: 0; transform-origin: 180px 108px; animation: smk-success-pulse 2.6s 1.6s ease-out infinite; }
    .smk-success-plainhtmls .ray   { stroke: var(--c-accent); stroke-width: 4; stroke-linecap: round; }
    .smk-success-plainhtmls .title { fill: var(--c-fg); font-size: 16px; font-weight: 650; }
    .smk-success-plainhtmls .sub   { fill: var(--c-muted); font-size: 13px; }
    .smk-success-plainhtmls .draw  { stroke-dasharray: 1; stroke-dashoffset: 0; animation: smk-success-draw .7s cubic-bezier(.65, 0, .35, 1) both; }
    .smk-success-plainhtmls .grow  { transform-origin: 180px 108px; animation: smk-success-grow .5s cubic-bezier(.34, 1.56, .64, 1) both; }
    .smk-success-plainhtmls .burst { transform-origin: 180px 108px; opacity: 0; animation: smk-success-burst .7s 1.05s ease-out both; }
    .smk-success-plainhtmls .rise  { animation: smk-success-rise .6s ease-out both; }
    @keyframes smk-success-draw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes smk-success-grow  { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes smk-success-burst { 0% { opacity: 0; transform: scale(.85); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15); } }
    @keyframes smk-success-pulse { 0% { opacity: .5; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.45); } }
    @keyframes smk-success-rise  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .smk-success-plainhtmls * { animation: none !important; } .smk-success-plainhtmls .burst { opacity: 0; } }
  </style>
  <rect class="card" x="1" y="1" width="358" height="262" rx="18"/>
  <circle class="pulse" cx="180" cy="108" r="52"/>
  <circle class="disc grow" cx="180" cy="108" r="52"/>
  <circle class="ring draw" cx="180" cy="108" r="52" pathLength="1" transform="rotate(-90 180 108)" style="animation-delay:.15s"/>
  <path class="tick draw" pathLength="1" d="M157 109 L173 125 L204 92" style="animation-delay:.7s"/>
  <g class="burst">
    <line class="ray" x1="180" y1="38" x2="180" y2="26"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(45 180 108)"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(90 180 108)"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(135 180 108)"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(180 180 108)"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(225 180 108)"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(270 180 108)"/>
    <line class="ray" x1="180" y1="38" x2="180" y2="26" transform="rotate(315 180 108)"/>
  </g>
  <text class="title rise" x="180" y="208" text-anchor="middle" style="animation-delay:1s">Changes saved</text>
  <text class="sub rise" x="180" y="230" text-anchor="middle" style="animation-delay:1.15s">Synced just now</text>
</svg>
