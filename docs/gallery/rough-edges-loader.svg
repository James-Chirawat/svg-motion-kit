<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140" class="smk-loader-roughedges" role="img" aria-labelledby="smk-title-roughedges">
  <title id="smk-title-roughedges">Loading content</title>
  <style>
    .smk-loader-roughedges {
      --c-bg: #fafaf9; --c-fg: #1c1917; --c-line: #e7e5e4;
      --c-primary: #0f766e; --c-accent: #0f766e;
      --c-skel: color-mix(in srgb, var(--c-fg) 9%, var(--c-bg));
      --c-shine: color-mix(in srgb, var(--c-bg) 70%, white);
    }
    
    .smk-loader-roughedges .card  { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .smk-loader-roughedges .track { fill: none; stroke: var(--c-skel); stroke-width: 7; }
    .smk-loader-roughedges .arc   { fill: none; stroke: var(--c-primary); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 90 124; animation: smk-loader-dash 1.4s ease-in-out infinite; }
    .smk-loader-roughedges .arc2  { fill: none; stroke: var(--c-accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 40 86; }
    .smk-loader-roughedges .dot   { fill: var(--c-fg); transform-origin: 70px 70px; animation: smk-loader-pulse 1.4s ease-in-out infinite; }
    .smk-loader-roughedges .skel  { fill: var(--c-skel); }
    .smk-loader-roughedges .s-edge { stop-color: var(--c-shine); stop-opacity: 0; }
    .smk-loader-roughedges .s-mid  { stop-color: var(--c-shine); stop-opacity: .9; }
    .smk-loader-roughedges .spin   { transform-origin: 70px 70px; animation: smk-loader-spin 1.4s linear infinite; }
    .smk-loader-roughedges .spin-r { transform-origin: 70px 70px; animation: smk-loader-spin 2.2s linear infinite reverse; }
    .smk-loader-roughedges .shimmer { animation: smk-loader-shimmer 1.6s ease-in-out infinite; }
    @keyframes smk-loader-spin    { to { transform: rotate(360deg); } }
    @keyframes smk-loader-dash    { 0% { stroke-dasharray: 1 213; stroke-dashoffset: 0; } 50% { stroke-dasharray: 140 74; stroke-dashoffset: -30; } 100% { stroke-dasharray: 1 213; stroke-dashoffset: -213; } }
    @keyframes smk-loader-pulse   { 0%, 100% { transform: scale(1); } 50% { transform: scale(.55); } }
    @keyframes smk-loader-shimmer { from { transform: translateX(40px); } to { transform: translateX(340px); } }
    @media (prefers-reduced-motion: reduce) { .smk-loader-roughedges * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="smk-shine-roughedges" x1="0" x2="1" y1="0" y2="0">
      <stop class="s-edge" offset="0"/><stop class="s-mid" offset=".5"/><stop class="s-edge" offset="1"/>
    </linearGradient>
    <clipPath id="smk-skeleton-roughedges">
      <circle cx="148" cy="42" r="16"/>
      <rect x="174" y="32" width="120" height="9" rx="4.5"/>
      <rect x="174" y="48" width="80" height="9" rx="4.5"/>
      <rect x="132" y="74" width="196" height="9" rx="4.5"/>
      <rect x="132" y="90" width="170" height="9" rx="4.5"/>
      <rect x="132" y="106" width="120" height="9" rx="4.5"/>
    </clipPath>
  </defs>
  <rect class="card" x="1" y="1" width="358" height="138" rx="20"/>
  <circle class="track" cx="70" cy="70" r="34"/>
  <g class="spin"><circle class="arc" cx="70" cy="70" r="34"/></g>
  <g class="spin-r"><circle class="arc2" cx="70" cy="70" r="20"/></g>
  <circle class="dot" cx="70" cy="70" r="6"/>
  <g clip-path="url(#smk-skeleton-roughedges)">
    <rect class="skel" x="120" y="20" width="220" height="100"/>
    <rect class="shimmer" x="0" y="20" width="80" height="100" fill="url(#smk-shine-roughedges)"/>
  </g>
</svg>
