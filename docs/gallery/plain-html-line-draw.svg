<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" class="smk-line-draw-plainhtmll" role="img" aria-labelledby="smk-title-plainhtmll">
  <title id="smk-title-plainhtmll">A line chart that draws itself</title>
  <style>
    .smk-line-draw-plainhtmll {
      --c-bg: #ffffff; --c-fg: #0f172a; --c-line: #e2e8f0;
      --c-primary: #0ea5e9; --c-accent: #f97316;
      --c-area: color-mix(in srgb, var(--c-primary) 10%, var(--c-bg));
    }
    @media (prefers-color-scheme: dark) { .smk-line-draw-plainhtmll { --c-bg: #0b1120; --c-fg: #f1f5f9; --c-line: #1e293b; --c-primary: #38bdf8; --c-accent: #fb923c; } }
    .smk-line-draw-plainhtmll .card  { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .smk-line-draw-plainhtmll .grid  { fill: none; stroke: var(--c-line); stroke-width: 1.5; stroke-dasharray: 2 6; }
    .smk-line-draw-plainhtmll .base  { fill: none; stroke: var(--c-line); stroke-width: 2; stroke-linecap: round; }
    .smk-line-draw-plainhtmll .area  { fill: var(--c-area); }
    .smk-line-draw-plainhtmll .line  { fill: none; stroke: var(--c-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .smk-line-draw-plainhtmll .point { fill: var(--c-bg); stroke: var(--c-primary); stroke-width: 2.5; }
    .smk-line-draw-plainhtmll .bead  { fill: none; stroke: var(--c-accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: .03 .97; opacity: 0; }
    .smk-line-draw-plainhtmll .draw  { stroke-dasharray: 1; stroke-dashoffset: 0; animation: smk-line-draw-draw 1.8s linear both; }
    .smk-line-draw-plainhtmll .pop   { transform-box: fill-box; transform-origin: center; animation: smk-line-draw-pop .45s cubic-bezier(.34, 1.56, .64, 1) both; }
    .smk-line-draw-plainhtmll .fade  { animation: smk-line-draw-fade .8s ease-out both; }
    .smk-line-draw-plainhtmll .bead  { animation: smk-line-draw-show .4s 2.4s both, smk-line-draw-travel 2.8s 2.4s linear infinite; }
    @keyframes smk-line-draw-draw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes smk-line-draw-pop    { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes smk-line-draw-fade   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes smk-line-draw-show   { to { opacity: 1; } }
    @keyframes smk-line-draw-travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1; } }
    @media (prefers-reduced-motion: reduce) { .smk-line-draw-plainhtmll * { animation: none !important; } }
  </style>
  <rect class="card" x="1" y="1" width="358" height="198" rx="18"/>
  <path class="grid" d="M32 60 H328 M32 100 H328 M32 140 H328"/>
  <path class="base" d="M32 168 H328"/>
  <path class="area fade" d="M36 150 C80 150 92 96 136 100 S196 140 232 112 S292 50 324 58 L324 168 L36 168 Z" style="animation-delay:1.8s"/>
  <path class="line draw" pathLength="1" d="M36 150 C80 150 92 96 136 100 S196 140 232 112 S292 50 324 58" style="animation-delay:.2s"/>
  <path class="bead" pathLength="1" d="M36 150 C80 150 92 96 136 100 S196 140 232 112 S292 50 324 58"/>
  <circle class="point pop" cx="136" cy="100" r="5" style="animation-delay:.8s"/>
  <circle class="point pop" cx="232" cy="112" r="5" style="animation-delay:1.4s"/>
  <circle class="point pop" cx="324" cy="58" r="5" style="animation-delay:2s"/>
</svg>
