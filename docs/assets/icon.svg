<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- svg-motion-kit icon: an ink "S" drawn as a bezier path on drafting paper, with one control
       handle showing and a vermilion pen tip. Source for plugins/svg-motion-kit/.claude-plugin/icon.png
       (render at 1024x1024). Brand palette: paper #F4EFE6, ink #1B1A17, vermilion #E2462B. -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="4" fill="#DDD4C3"/>
    </pattern>
  </defs>

  <!-- full-bleed so a rounded-square or circle mask still works -->
  <rect width="1024" height="1024" fill="#F4EFE6"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- control handle on the top anchor -->
  <line x1="680" y1="330" x2="782" y2="210" stroke="#9A9184" stroke-width="14" stroke-linecap="round" stroke-dasharray="4 30"/>
  <rect x="756" y="184" width="52" height="52" fill="#1B1A17"/>

  <!-- the S -->
  <path d="M680 330 C640 250 560 222 500 222 C400 222 340 280 340 360 C340 450 420 480 512 512 C604 544 684 574 684 664 C684 744 624 802 524 802 C464 802 384 774 344 694"
        fill="none" stroke="#1B1A17" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- anchor at the start, pen tip at the end -->
  <circle cx="680" cy="330" r="34" fill="#F4EFE6" stroke="#1B1A17" stroke-width="18"/>
  <circle cx="344" cy="694" r="72" fill="#E2462B"/>
  <circle cx="344" cy="694" r="72" fill="none" stroke="#F4EFE6" stroke-width="18"/>
</svg>
