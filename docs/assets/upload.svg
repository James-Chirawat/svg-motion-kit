<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140" role="img" aria-labelledby="title">
  <title id="title">Uploading report-q3.pdf</title>
  <!-- Theme: ink + amber, monochrome with one accent. Progress fills, a tick lands, the cycle repeats. -->
  <style>
    :root {
      --bg: #FAFAF7; --border: #E4E4E0; --ink: #18181B; --muted: #71717A;
      --soft: #EDEDE8; --accent: #E0A400; --on-accent: #18181B; --paper: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113; --border: #2A2A2E; --ink: #F4F4F5; --muted: #A1A1AA;
        --soft: #232326; --accent: #FFC72C; --paper: #1A1A1D;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card  { fill: var(--bg); stroke: var(--border); stroke-width: 2; }
    .doc   { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
    .fold  { fill: var(--soft); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
    .lines { fill: var(--muted); opacity: .5; }
    .badge { fill: var(--accent); }
    .arrow { fill: none; stroke: var(--on-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .name  { fill: var(--ink); font-size: 14px; font-weight: 650; }
    .meta  { fill: var(--muted); font-size: 12px; }
    .track { fill: var(--soft); }
    .bar   { fill: var(--accent); }
    .done  { fill: var(--ink); }
    .check { fill: none; stroke: var(--bg); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Shared 3.2s cycle: fill 0-65%, tick 68-92%, reset. */
    .bar   { transform-box: fill-box; transform-origin: left center; animation: fill 3.2s cubic-bezier(.4, 0, .2, 1) infinite; }
    .done  { transform-box: fill-box; transform-origin: center; animation: done 3.2s ease-out infinite; }
    .arrow { animation: lift 1.1s ease-in-out infinite; }

    @keyframes fill { 0% { transform: scaleX(0); opacity: 1; } 65%, 90% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes done { 0%, 66% { transform: scale(0); opacity: 0; } 74%, 90% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes lift { 0% { transform: translateY(3px); opacity: 0; } 30%, 70% { opacity: 1; } 100% { transform: translateY(-4px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bar { transform: scaleX(.6); } .done { opacity: 0; } }
  </style>

  <rect class="card" x="1" y="1" width="358" height="138" rx="20"/>

  <!-- document -->
  <path class="doc" d="M40 36 H70 L84 50 V102 Q84 106 80 106 H40 Q36 106 36 102 V40 Q36 36 40 36 Z"/>
  <path class="fold" d="M70 36 V46 Q70 50 74 50 H84 Z"/>
  <rect class="lines" x="44" y="60" width="28" height="4" rx="2"/>
  <rect class="lines" x="44" y="70" width="20" height="4" rx="2"/>
  <rect class="lines" x="44" y="80" width="24" height="4" rx="2"/>

  <!-- upload badge -->
  <circle class="badge" cx="84" cy="100" r="15"/>
  <path class="arrow" d="M84 107 V93 M78 99 L84 93 L90 99"/>

  <!-- label + progress -->
  <text class="name" x="120" y="62">report-q3.pdf</text>
  <text class="meta" x="120" y="80">2.4 MB · uploading</text>
  <rect class="track" x="120" y="92" width="190" height="8" rx="4"/>
  <rect class="bar" x="120" y="92" width="190" height="8" rx="4"/>

  <g class="done">
    <circle cx="328" cy="96" r="11"/>
    <path class="check" d="M323 96 L327 100 L334 92"/>
  </g>
</svg>
