<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" width="360" height="264" role="img" aria-labelledby="title">
  <title id="title">You're offline. Retrying.</title>
  <!-- Theme: terracotta on cream. The plug keeps reaching for the socket but never connects. -->
  <style>
    :root {
      --bg: #FBF6EF; --border: #EADFD0; --ink: #2B2118; --muted: #8C7B6B;
      --primary: #C4561C; --soft: #F3E2D3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1410; --border: #33281F; --ink: #F3E9DF; --muted: #A8968A;
        --primary: #E5814A; --soft: #3A2519;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card   { fill: var(--bg); stroke: var(--border); stroke-width: 2; }
    .cable  { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
    .plug   { fill: var(--primary); }
    .prong  { fill: var(--ink); }
    .socket { fill: var(--soft); stroke: var(--primary); stroke-width: 2.5; }
    .hole   { fill: var(--ink); }
    .spark  { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .dot    { fill: var(--primary); }
    .title  { fill: var(--ink); font-size: 16px; font-weight: 650; }
    .sub    { fill: var(--muted); font-size: 13px; }

    /* One 2.8s cycle shared by plug, socket and spark, so they stay in sync without delays. */
    .reach-l { animation: reach-l 2.8s cubic-bezier(.45, 0, .55, 1) infinite; }
    .reach-r { animation: reach-r 2.8s cubic-bezier(.45, 0, .55, 1) infinite; }
    .spark   { animation: spark 2.8s linear infinite; }
    .dot     { transform-box: fill-box; transform-origin: center; animation: bob 1.2s ease-in-out infinite; }

    @keyframes reach-l { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
    @keyframes reach-r { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-10px); } }
    @keyframes spark   { 0%, 42%, 60%, 100% { opacity: 0; } 47%, 53% { opacity: 1; } }
    @keyframes bob     { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { opacity: .6; } }
  </style>

  <rect class="card" x="1" y="1" width="358" height="262" rx="20"/>

  <!-- left: cable + plug (the cable starts off-card, so moving the group never shows its end) -->
  <g class="reach-l">
    <path class="cable" d="M-10 150 C60 150 72 112 122 112"/>
    <rect class="plug" x="118" y="94" width="42" height="36" rx="9"/>
    <rect class="prong" x="158" y="102" width="18" height="6" rx="3"/>
    <rect class="prong" x="158" y="116" width="18" height="6" rx="3"/>
  </g>

  <!-- right: cable + socket -->
  <g class="reach-r">
    <path class="cable" d="M370 150 C300 150 288 112 238 112"/>
    <rect class="socket" x="200" y="94" width="42" height="36" rx="9"/>
    <rect class="hole" x="206" y="102" width="10" height="6" rx="3"/>
    <rect class="hole" x="206" y="116" width="10" height="6" rx="3"/>
  </g>

  <!-- the spark that never quite bridges the gap -->
  <path class="spark" d="M183 98 L189 108 L184 110 L191 122"/>

  <text class="title" x="180" y="200" text-anchor="middle">You're offline</text>
  <text class="sub" x="180" y="222" text-anchor="middle">We'll reconnect automatically</text>
  <circle class="dot" cx="168" cy="242" r="3.5"/>
  <circle class="dot" cx="180" cy="242" r="3.5" style="animation-delay:.15s"/>
  <circle class="dot" cx="192" cy="242" r="3.5" style="animation-delay:.3s"/>
</svg>
