<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-labelledby="title desc">
  <title id="title">svg-motion-kit</title>
  <desc id="desc">A bezier curve is drawn on drafting paper with its control handles, a pen dot travels along it, and the title appears with the workflow: theme, scout, draw, audit.</desc>
  <!-- Brand theme: paper, ink and vermilion. Drafting-table look: dot grid, bezier handles, pen. -->
  <style>
    :root {
      --paper: #F4EFE6; --grid: #DDD4C3; --ink: #1B1A17; --muted: #6F685C;
      --accent: #E2462B; --handle: #9A9184;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #15130F; --grid: #2E2A23; --ink: #EDE7DC; --muted: #A39B8E;
        --accent: #FF6A4D; --handle: #6F685C;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card   { fill: var(--paper); stroke: var(--grid); stroke-width: 2; }
    .dots   { fill: var(--grid); }
    .curve  { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
    .hline  { stroke: var(--handle); stroke-width: 1.5; stroke-dasharray: 3 4; }
    .anchor { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
    .ctrl   { fill: var(--handle); }
    .pen    { fill: var(--accent); }
    .trail  { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: .06 .94; opacity: 0; }
    .title  { fill: var(--ink); font-size: 40px; font-weight: 750; letter-spacing: -1px; }
    .tag    { fill: var(--muted); font-size: 17px; }
    .step   { fill: none; stroke: var(--ink); stroke-width: 1.5; }
    .step-t { fill: var(--ink); font-size: 13px; font-weight: 600; }
    .arrow  { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Intro plays once on load, then only the pen keeps travelling. pathLength="1" on drawn paths. */
    .draw  { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.8s cubic-bezier(.65, 0, .35, 1) both; }
    .pop   { transform-box: fill-box; transform-origin: center; animation: pop .4s cubic-bezier(.34, 1.56, .64, 1) both; }
    .fade  { animation: fade .6s ease-out both; }
    .rise  { animation: rise .7s ease-out both; }
    .trail { animation: show .3s 2.4s both, travel 3.2s 2.4s cubic-bezier(.45, 0, .55, 1) infinite; }

    @keyframes draw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pop    { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes show   { to { opacity: 1; } }
    @keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="dots" cx="8" cy="8" r="1.1"/>
    </pattern>
  </defs>

  <rect class="card" x="1" y="1" width="838" height="218" rx="20"/>
  <rect x="24" y="20" width="290" height="180" rx="12" fill="url(#grid)"/>

  <!-- bezier handles (control points and tangent lines) -->
  <g class="fade" style="animation-delay:.1s">
    <line class="hline" x1="56" y1="160" x2="110" y2="56"/>
    <line class="hline" x1="170" y1="110" x2="128" y2="160"/>
    <line class="hline" x1="170" y1="110" x2="212" y2="60"/>
    <line class="hline" x1="282" y1="64" x2="238" y2="150"/>
    <rect class="ctrl" x="106" y="52" width="8" height="8"/>
    <rect class="ctrl" x="124" y="156" width="8" height="8"/>
    <rect class="ctrl" x="208" y="56" width="8" height="8"/>
    <rect class="ctrl" x="234" y="146" width="8" height="8"/>
  </g>

  <!-- the curve itself -->
  <path class="curve draw" pathLength="1" d="M56 160 C110 56 128 160 170 110 C212 60 238 150 282 64" style="animation-delay:.4s"/>
  <path class="trail" pathLength="1" d="M56 160 C110 56 128 160 170 110 C212 60 238 150 282 64"/>
  <circle class="anchor pop" cx="56"  cy="160" r="6" style="animation-delay:.3s"/>
  <circle class="anchor pop" cx="170" cy="110" r="6" style="animation-delay:1.2s"/>
  <circle class="pen pop"    cx="282" cy="64"  r="8" style="animation-delay:2.1s"/>

  <!-- title -->
  <text class="title rise" x="350" y="92" style="animation-delay:.5s">svg-motion-kit</text>
  <text class="tag rise" x="352" y="124" style="animation-delay:.8s">Theme-true motion and frontend reviews for Claude Code</text>

  <!-- workflow steps -->
  <g class="fade" style="animation-delay:1.3s">
    <rect class="step" x="352" y="146" width="68" height="28" rx="14"/>
    <text class="step-t" x="386" y="165" text-anchor="middle">theme</text>
    <path class="arrow" d="M428 160 H442 M437 155 L442 160 L437 165"/>
    <rect class="step" x="450" y="146" width="68" height="28" rx="14"/>
    <text class="step-t" x="484" y="165" text-anchor="middle">scout</text>
    <path class="arrow" d="M526 160 H540 M535 155 L540 160 L535 165"/>
    <rect class="step" x="548" y="146" width="62" height="28" rx="14"/>
    <text class="step-t" x="579" y="165" text-anchor="middle">draw</text>
    <path class="arrow" d="M618 160 H632 M627 155 L632 160 L627 165"/>
    <rect class="step" x="640" y="146" width="68" height="28" rx="14" style="fill: var(--accent); stroke: var(--accent)"/>
    <text class="step-t" x="674" y="165" text-anchor="middle" style="fill: var(--paper)">audit</text>
  </g>
</svg>
