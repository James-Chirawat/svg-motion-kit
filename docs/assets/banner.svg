<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-labelledby="title desc">
  <title id="title">svg-motion-kit</title>
  <desc id="desc">Banner: a browser window draws itself, a chart line traces across it, and the project title fades in.</desc>
  <style>
    :root {
      --bg: #F8FAFC; --border: #E2E8F0; --ink: #0F172A; --muted: #64748B;
      --primary: #6366F1; --soft: #E0E7FF; --accent: #06B6D4; --pink: #EC4899; --amber: #F59E0B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F172A; --border: #1E293B; --ink: #F1F5F9; --muted: #94A3B8;
        --primary: #818CF8; --soft: #1E1B4B; --accent: #22D3EE; --pink: #F472B6; --amber: #FBBF24;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card  { fill: var(--bg); stroke: var(--border); stroke-width: 2; }
    .frame { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; }
    .grid  { fill: none; stroke: var(--border); stroke-width: 2; stroke-linecap: round; }
    .line  { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .area  { fill: var(--soft); }
    .point { fill: var(--bg); stroke: var(--primary); stroke-width: 2.5; }
    .title { fill: var(--ink); font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .tag   { fill: var(--muted); font-size: 18px; }
    .chip  { fill: var(--soft); }
    .chip-t{ fill: var(--primary); font-size: 13px; font-weight: 600; }
    .spark { fill: var(--primary); }
    .c-pink { fill: var(--pink); } .c-amber { fill: var(--amber); } .c-accent { fill: var(--accent); }

    .flow  { fill: none; stroke: var(--primary); stroke-width: 5; stroke-linecap: round; stroke-dasharray: .04 .96; opacity: 0; }

    /* Intro plays once (re-runs on every page load), then only ambient loops continue.
       pathLength="1" lets every drawn path share the same dash values. */
    .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.6s ease-in-out both; }
    .line.draw { animation-duration: 1.8s; animation-timing-function: linear; }
    .pop  { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.34, 1.56, .64, 1) both; }
    .rise { animation: rise .7s ease-out both; }
    .fade { animation: fade .8s ease-out both; }
    .flow { animation: show .4s 3s both, flow 2.6s 3s linear infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }

    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes show { from { opacity: 0; } to { opacity: .9; } }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1; } }
    @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect class="card" x="1" y="1" width="838" height="218" rx="20"/>

  <!-- Browser window -->
  <path class="frame draw" pathLength="1" d="M60 40 H300 Q312 40 312 52 V168 Q312 180 300 180 H60 Q48 180 48 168 V52 Q48 40 60 40 Z"/>
  <path class="frame draw" pathLength="1" d="M48 64 H312" style="animation-delay:.4s"/>
  <circle class="c-pink pop"   cx="64" cy="52" r="4" style="animation-delay:.8s"/>
  <circle class="c-amber pop"  cx="78" cy="52" r="4" style="animation-delay:.9s"/>
  <circle class="c-accent pop" cx="92" cy="52" r="4" style="animation-delay:1s"/>

  <!-- Chart -->
  <path class="grid" d="M68 152 H292"/>
  <path class="area fade" d="M68 148 C100 148 108 110 140 112 S182 140 210 120 S258 78 292 84 L292 152 L68 152 Z" style="animation-delay:2.6s"/>
  <path class="line draw" pathLength="1" d="M68 148 C100 148 108 110 140 112 S182 140 210 120 S258 78 292 84" style="animation-delay:1s"/>
  <path class="flow" pathLength="1" d="M68 148 C100 148 108 110 140 112 S182 140 210 120 S258 78 292 84"/>
  <circle class="point pop" cx="140" cy="112" r="5" style="animation-delay:1.55s"/>
  <circle class="point pop" cx="210" cy="120" r="5" style="animation-delay:2.05s"/>
  <circle class="point pop" cx="292" cy="84"  r="5" style="animation-delay:2.75s"/>

  <!-- Title -->
  <text class="title rise" x="360" y="100" style="animation-delay:.6s">svg-motion-kit</text>
  <text class="tag rise" x="362" y="134" style="animation-delay:.9s">Themed, animated SVG for your frontend</text>

  <g class="pop" style="animation-delay:1.4s">
    <rect class="chip" x="362" y="152" width="64" height="26" rx="13"/>
    <text class="chip-t" x="394" y="170" text-anchor="middle">React</text>
  </g>
  <g class="pop" style="animation-delay:1.55s">
    <rect class="chip" x="434" y="152" width="52" height="26" rx="13"/>
    <text class="chip-t" x="460" y="170" text-anchor="middle">Vue</text>
  </g>
  <g class="pop" style="animation-delay:1.7s">
    <rect class="chip" x="494" y="152" width="60" height="26" rx="13"/>
    <text class="chip-t" x="524" y="170" text-anchor="middle">HTML</text>
  </g>

  <!-- Sparkles -->
  <g transform="translate(784 58)"><path class="spark twinkle" d="M0 -10 C1.2 -2.5 2.5 -1.2 10 0 C2.5 1.2 1.2 2.5 0 10 C-1.2 2.5 -2.5 1.2 -10 0 C-2.5 -1.2 -1.2 -2.5 0 -10 Z"/></g>
  <g transform="translate(752 168) scale(.6)"><path class="spark twinkle" style="animation-delay:.8s" d="M0 -10 C1.2 -2.5 2.5 -1.2 10 0 C2.5 1.2 1.2 2.5 0 10 C-1.2 2.5 -2.5 1.2 -10 0 C-2.5 -1.2 -1.2 -2.5 0 -10 Z"/></g>
</svg>
