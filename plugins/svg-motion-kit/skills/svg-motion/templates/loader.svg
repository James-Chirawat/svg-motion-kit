<!-- smk: loading state. Spinner plus a content skeleton with a moving shimmer; use instead of a bare "Loading…" text. Roles: primary, accent, background, foreground, border. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140" class="__S__" role="img" aria-labelledby="smk-title-__U__">
  <title id="smk-title-__U__">{{text:title|Loading content}}</title>
  <style>
    .__S__ {
      --c-bg: {{background|#F2F5F7~#0E1720}}; --c-fg: {{foreground|#16324F~#E6EDF2}}; --c-line: {{border|#DCE3E8~#1E2C38}};
      --c-primary: {{primary|#2F6FA3~#6AA6D6}}; --c-accent: {{accent|primary|#3FA68C~#7FD1BB}};
      --c-skel: color-mix(in srgb, var(--c-fg) 9%, var(--c-bg));
      --c-shine: color-mix(in srgb, var(--c-bg) 70%, white);
    }
    {{dark}}
    .__S__ .card  { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .__S__ .track { fill: none; stroke: var(--c-skel); stroke-width: 7; }
    .__S__ .arc   { fill: none; stroke: var(--c-primary); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 90 124; animation: __K__-dash 1.4s ease-in-out infinite; }
    .__S__ .arc2  { fill: none; stroke: var(--c-accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 40 86; }
    .__S__ .dot   { fill: var(--c-fg); transform-origin: 70px 70px; animation: __K__-pulse 1.4s ease-in-out infinite; }
    .__S__ .skel  { fill: var(--c-skel); }
    .__S__ .s-edge { stop-color: var(--c-shine); stop-opacity: 0; }
    .__S__ .s-mid  { stop-color: var(--c-shine); stop-opacity: .9; }
    .__S__ .spin   { transform-origin: 70px 70px; animation: __K__-spin 1.4s linear infinite; }
    .__S__ .spin-r { transform-origin: 70px 70px; animation: __K__-spin 2.2s linear infinite reverse; }
    .__S__ .shimmer { animation: __K__-shimmer 1.6s ease-in-out infinite; }
    @keyframes __K__-spin    { to { transform: rotate(360deg); } }
    @keyframes __K__-dash    { 0% { stroke-dasharray: 1 213; stroke-dashoffset: 0; } 50% { stroke-dasharray: 140 74; stroke-dashoffset: -30; } 100% { stroke-dasharray: 1 213; stroke-dashoffset: -213; } }
    @keyframes __K__-pulse   { 0%, 100% { transform: scale(1); } 50% { transform: scale(.55); } }
    @keyframes __K__-shimmer { from { transform: translateX(40px); } to { transform: translateX(340px); } }
    @media (prefers-reduced-motion: reduce) { .__S__ * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="smk-shine-__U__" x1="0" x2="1" y1="0" y2="0">
      <stop class="s-edge" offset="0"/><stop class="s-mid" offset=".5"/><stop class="s-edge" offset="1"/>
    </linearGradient>
    <clipPath id="smk-skeleton-__U__">
      <circle cx="148" cy="42" r="16"/>
      <rect x="174" y="32" width="120" height="9" rx="4.5"/>
      <rect x="174" y="48" width="80" height="9" rx="4.5"/>
      <rect x="132" y="74" width="196" height="9" rx="4.5"/>
      <rect x="132" y="90" width="170" height="9" rx="4.5"/>
      <rect x="132" y="106" width="120" height="9" rx="4.5"/>
    </clipPath>
  </defs>
  <rect class="card" data-smk-card x="1" y="1" width="358" height="138" rx="{{radius|20}}"/>
  <circle class="track" cx="70" cy="70" r="34"/>
  <g class="spin"><circle class="arc" cx="70" cy="70" r="34"/></g>
  <g class="spin-r"><circle class="arc2" cx="70" cy="70" r="20"/></g>
  <circle class="dot" cx="70" cy="70" r="6"/>
  <g clip-path="url(#smk-skeleton-__U__)">
    <rect class="skel" x="120" y="20" width="220" height="100"/>
    <rect class="shimmer" x="0" y="20" width="80" height="100" fill="url(#smk-shine-__U__)"/>
  </g>
</svg>
