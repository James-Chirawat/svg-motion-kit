<!-- smk: upload in progress. A progress bar fills, a done tick lands, the cycle repeats. Roles: accent, primary, background, foreground, mutedForeground, border. Texts: title (file name), subtitle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140" class="__S__" role="img" aria-labelledby="smk-title-__U__">
  <title id="smk-title-__U__">Uploading {{text:title|report-q3.pdf}}</title>
  <style>
    .__S__ {
      --c-bg: {{background|#FAFAF7~#111113}}; --c-fg: {{foreground|#18181B~#F4F4F5}}; --c-muted: {{mutedForeground|#71717A~#A1A1AA}};
      --c-line: {{border|#E4E4E0~#2A2A2E}}; --c-accent: {{accent|primary|#E0A400~#FFC72C}};
      --c-soft: color-mix(in srgb, var(--c-fg) 8%, var(--c-bg));
      --c-paper: color-mix(in srgb, var(--c-fg) 2%, var(--c-bg));
    }
    {{dark}}
    .__S__ text { font-family: {{font}}; }
    .__S__ .card  { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .__S__ .doc   { fill: var(--c-paper); stroke: var(--c-fg); stroke-width: 2.5; stroke-linejoin: round; }
    .__S__ .fold  { fill: var(--c-soft); stroke: var(--c-fg); stroke-width: 2.5; stroke-linejoin: round; }
    .__S__ .lines { fill: var(--c-muted); opacity: .5; }
    .__S__ .badge { fill: var(--c-accent); }
    .__S__ .arrow { fill: none; stroke: var(--c-bg); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; animation: __K__-lift 1.1s ease-in-out infinite; }
    .__S__ .name  { fill: var(--c-fg); font-size: 14px; font-weight: 650; }
    .__S__ .meta  { fill: var(--c-muted); font-size: 12px; }
    .__S__ .track { fill: var(--c-soft); }
    .__S__ .bar   { fill: var(--c-accent); transform-box: fill-box; transform-origin: left center; animation: __K__-fill 3.2s cubic-bezier(.4, 0, .2, 1) infinite; }
    .__S__ .done  { fill: var(--c-fg); transform-box: fill-box; transform-origin: center; animation: __K__-done 3.2s ease-out infinite; }
    .__S__ .check { fill: none; stroke: var(--c-bg); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes __K__-fill { 0% { transform: scaleX(0); opacity: 1; } 65%, 90% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes __K__-done { 0%, 66% { transform: scale(0); opacity: 0; } 74%, 90% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes __K__-lift { 0% { transform: translateY(3px); opacity: 0; } 30%, 70% { opacity: 1; } 100% { transform: translateY(-4px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .__S__ * { animation: none !important; } .__S__ .bar { transform: scaleX(.6); } .__S__ .done { opacity: 0; } }
  </style>
  <rect class="card" data-smk-card x="1" y="1" width="358" height="138" rx="{{radius|20}}"/>
  <path class="doc" d="M40 36 H70 L84 50 V102 Q84 106 80 106 H40 Q36 106 36 102 V40 Q36 36 40 36 Z"/>
  <path class="fold" d="M70 36 V46 Q70 50 74 50 H84 Z"/>
  <rect class="lines" x="44" y="60" width="28" height="4" rx="2"/>
  <rect class="lines" x="44" y="70" width="20" height="4" rx="2"/>
  <rect class="lines" x="44" y="80" width="24" height="4" rx="2"/>
  <circle class="badge" cx="84" cy="100" r="15"/>
  <path class="arrow" d="M84 107 V93 M78 99 L84 93 L90 99"/>
  <text class="name" x="120" y="62">{{text:title|report-q3.pdf}}</text>
  <text class="meta" x="120" y="80">{{text:subtitle|Uploading…}}</text>
  <rect class="track" x="120" y="92" width="190" height="8" rx="4"/>
  <rect class="bar" x="120" y="92" width="190" height="8" rx="4"/>
  <g class="done"><circle cx="328" cy="96" r="11"/><path class="check" d="M323 96 L327 100 L334 92"/></g>
</svg>
