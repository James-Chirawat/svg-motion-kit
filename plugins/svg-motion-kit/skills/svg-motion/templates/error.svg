<!-- smk: error state when loading or saving fails. A dashed connection breaks, an alert mark draws and gives one small shake. Roles: destructive, primary, background, foreground, mutedForeground, border. Texts: title, subtitle, action. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" width="360" height="264" class="__S__" role="img" aria-labelledby="smk-title-__U__">
  <title id="smk-title-__U__">{{text:title|Something went wrong}}</title>
  <style>
    .__S__ {
      --c-bg: {{background|#FAF7F2~#16120F}}; --c-fg: {{foreground|#2A211B~#F2EAE2}}; --c-muted: {{mutedForeground|#7D7268~#A39A90}};
      --c-line: {{border|#E8DFD4~#2E2620}}; --c-danger: {{destructive|#C2412D~#F07A63}}; --c-primary: {{primary|foreground|#2A211B~#F2EAE2}};
      --c-soft: color-mix(in srgb, var(--c-danger) 12%, var(--c-bg));
    }
    {{dark}}
    .__S__ text { font-family: {{font}}; }
    .__S__ .card   { fill: var(--c-bg); stroke: var(--c-line); stroke-width: 2; }
    .__S__ .node   { fill: var(--c-bg); stroke: var(--c-fg); stroke-width: 2.5; }
    .__S__ .wire   { fill: none; stroke: var(--c-muted); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 5 6; }
    .__S__ .disc   { fill: var(--c-soft); }
    .__S__ .mark   { fill: none; stroke: var(--c-danger); stroke-width: 6; stroke-linecap: round; }
    .__S__ .dot    { fill: var(--c-danger); }
    .__S__ .title  { fill: var(--c-fg); font-size: 16px; font-weight: 650; }
    .__S__ .sub    { fill: var(--c-muted); font-size: 13px; }
    .__S__ .btn    { fill: none; stroke: var(--c-primary); stroke-width: 1.5; }
    .__S__ .btn-t  { fill: var(--c-primary); font-size: 12px; font-weight: 600; }
    .__S__ .snap-l { animation: __K__-snap-l .5s .4s cubic-bezier(.3, 1.6, .5, 1) both; }
    .__S__ .snap-r { animation: __K__-snap-r .5s .4s cubic-bezier(.3, 1.6, .5, 1) both; }
    .__S__ .draw   { stroke-dasharray: 1; stroke-dashoffset: 0; animation: __K__-draw .5s cubic-bezier(.65, 0, .35, 1) both; }
    .__S__ .shake  { transform-origin: 180px 100px; animation: __K__-shake .5s 1.3s ease-in-out both; }
    .__S__ .rise   { animation: __K__-rise .6s ease-out both; }
    @keyframes __K__-snap-l { from { transform: translateX(10px); } to { transform: translateX(0); } }
    @keyframes __K__-snap-r { from { transform: translateX(-10px); } to { transform: translateX(0); } }
    @keyframes __K__-draw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes __K__-shake  { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(-3deg); } }
    @keyframes __K__-rise   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .__S__ * { animation: none !important; } }
  </style>
  <rect class="card" data-smk-card x="1" y="1" width="358" height="262" rx="{{radius|20}}"/>
  <g class="snap-l"><path class="wire" d="M66 100 H128"/><circle class="node" cx="58" cy="100" r="9"/></g>
  <g class="snap-r"><path class="wire" d="M232 100 H294"/><circle class="node" cx="302" cy="100" r="9"/></g>
  <g class="shake">
    <circle class="disc" cx="180" cy="100" r="42"/>
    <path class="mark draw" pathLength="1" d="M180 78 V106" style="animation-delay:.8s"/>
    <circle class="dot rise" cx="180" cy="121" r="4.5" style="animation-delay:1.1s"/>
  </g>
  <text class="title rise" x="180" y="176" text-anchor="middle" style="animation-delay:.9s">{{text:title|Something went wrong}}</text>
  <text class="sub rise" x="180" y="198" text-anchor="middle" style="animation-delay:1s">{{text:subtitle|We couldn't load this. Check your connection.}}</text>
  <g class="rise" style="animation-delay:1.2s">
    <rect class="btn" x="138" y="212" width="84" height="30" rx="15"/>
    <text class="btn-t" x="180" y="231" text-anchor="middle">{{text:action|Try again}}</text>
  </g>
</svg>
